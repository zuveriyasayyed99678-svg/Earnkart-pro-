<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnKart Pro</title>
<style>body{margin:0;font-family:sans-serif;background:#f9fafb}#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:380px;width:100%}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;box-sizing:border-box}.btn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:700}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tab{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd}</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script>emailjs.init("2vIvGOG0rye3T0i");</script>
</head><body>
<div id="splash"><div><div style="width:80px;height:80px;background:#fff;color:#2563eb;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:auto;font-weight:900;font-size:32px">EK</div><h2>EarnKart Pro</h2><div style="width:120px;height:4px;background:rgba(255,255,255,.3);margin:20px auto;border-radius:10px;overflow:hidden"><div id="load" style="height:100%;background:#fff;width:0%"></div></div></div></div>

<div id="auth" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px"><div class="card"><h2 style="text-align:center;color:#2563eb">EarnKart Pro</h2><div style="display:flex;background:#f3f4f6;border-radius:10px;padding:4px;margin:10px 0"><button id="tR" onclick="tabR()" style="flex:1;padding:8px;border:none;background:#2563eb;color:#fff;border-radius:8px">Register</button><button id="tL" onclick="tabL()" style="flex:1;padding:8px;border:none;background:transparent">Login</button></div>
<form id="fR" onsubmit="reg(event)"><input id="rN" required placeholder="Full Name"><input id="rE" required type="email" placeholder="Email"><input id="rP" required type="password" placeholder="Password"><button class="btn">Create +20 Coins</button></form>
<form id="fL" onsubmit="log(event)" style="display:none"><input id="lE" required type="email" placeholder="Email"><input id="lP" required type="password" placeholder="Password"><button class="btn" style="background:#111">Login</button></form></div></div>

<div id="dash" style="display:none;padding-bottom:70px"><header style="background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1)"><b style="color:#2563eb">EarnKart Pro <span id="uid" style="font-size:10px;color:#999"></span></b><div><span style="background:#fef9c3;padding:5px 10px;border-radius:20px;font-weight:700">🪙 <span id="bal">0</span></span> <button onclick="logout()" style="margin-left:6px;background:#fee2e2;color:#dc2626;border:1px solid #fecaca;padding:5px 10px;border-radius:20px">Logout</button></div></header>
<main style="max-width:420px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px">
<div id="home"><div style="background:#2563eb;color:#fff;padding:14px;border-radius:12px"><div style="display:flex;justify-content:space-between"><span>Daily Progress</span><span id="dtxt">0</span></div><div style="background:rgba(255,255,255,.3);height:8px;border-radius:10px;margin-top:8px"><div id="dbar" style="background:#fff;height:8px;width:0%;border-radius:10px"></div></div></div>
<div style="background:#fff;padding:14px;border-radius:12px"><b>▶ Watch Ads x10 - 5 Coins Each</b><div id="agrid" class="grid5" style="margin-top:8px"></div></div>
<div style="background:#fff;padding:14px;border-radius:12px"><b>🤖 Captcha - 2 Coins Unlimited</b><div style="display:flex;gap:8px;margin-top:8px"><div id="capB" style="background:#000;color:#fff;padding:10px 20px;border-radius:10px;font-size:18px;letter-spacing:2px">XXXXXX</div><button onclick="gCap()" style="border:none;background:#eee;border-radius:10px;width:45px">↻</button></div><div style="display:flex;gap:8px;margin-top:8px"><input id="capI" placeholder="Enter Code" style="margin:0"><button onclick="vCap()" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 16px">Submit</button></div><div style="font-size:12px;color:#666;margin-top:4px"><span id="capDone">0</span> Done</div></div>
<div style="background:#fff;padding:14px;border-radius:12px"><b>👥 Refer - 50 Coins</b><div style="display:flex;gap:6px;margin-top:6px"><input id="refL" readonly style="margin:0;font-size:12px"><button onclick="copyR()" style="background:#9333ea;color:#fff;border:none;border-radius:10px;padding:10px 14px">Copy</button></div></div>
</div>
<div id="hist" style="display:none"><div style="background:#fff;padding:12px;border-radius:12px"><b>📜 Earning History</b><div id="ehist" style="margin-top:8px"></div></div><div style="background:#fff;padding:12px;border-radius:12px;margin-top:10px"><b>💸 Withdraw History</b><div id="whist" style="margin-top:8px"></div></div></div>
<div id="wal" style="display:none"><div style="background:#fff;padding:12px;border-radius:12px"><b>💰 Withdraw (Min 500 = Rs5)</b><input id="upi" placeholder="UPI ID" style="margin-top:8px"><input id="wamt" type="number" placeholder="Coins - Min 500"><button onclick="wd()" style="width:100%;background:#facc15;border:none;padding:12px;border-radius:10px;font-weight:700;margin-top:6px">Withdraw</button></div></div>
<div id="prof" style="display:none"><div style="background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:20px;border-radius:16px;text-align:center"><div id="av" style="width:60px;height:60px;background:#fff;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;font-weight:900;font-size:24px">U</div><div id="pname" style="font-weight:800;margin-top:8px">User</div><div id="pemail" style="font-size:12px">email</div><div id="pid" style="font-size:11px;margin-top:6px;background:rgba(255,255,255,.2);display:inline-block;padding:4px 10px;border-radius:20px"></div></div>
<div style="background:#fff;padding:12px;border-radius:12px;margin-top:10px"><b>Edit Name</b><input id="ename"><button onclick="saveP()" style="width:100%;background:#2563eb;color:#fff;border:none;padding:10px;border-radius:10px;margin-top:6px">Save</button></div></div>
</main><div class="tab"><button onclick="sTab('home')" id="bh" style="flex:1;border:none;background:#eff6ff;color:#2563eb">🏠<br><span style="font-size:10px">Home</span></button><button onclick="sTab('hist')" id="bhi" style="flex:1;border:none;background:transparent">📊<br><span style="font-size:10px">History</span></button><button onclick="sTab('wal')" id="bw" style="flex:1;border:none;background:transparent">💰<br><span style="font-size:10px">Wallet</span></button><button onclick="sTab('prof')" id="bp" style="flex:1;border:none;background:transparent">👤<br><span style="font-size:10px">Profile</span></button></div></div>

<div id="adM" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center"><div style="background:#fff;padding:20px;border-radius:16px;text-align:center;width:280px"><h3>🎯 Ad Watching...</h3><div style="background:#eee;height:8px;border-radius:10px;margin-top:10px"><div id="adB" style="background:#2563eb;height:8px;width:0%;border-radius:10px"></div></div><h1 id="adT">10</h1></div></div>

<script>
let cur=null,code="";const DIRECT="https://regaincocoa.com/hvm2229w?key=830361f756608c8ecf127071e303debd";
function hide(){let s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';let u=localStorage.getItem('ek_current');if(u){cur=JSON.parse(u);showD();}else{document.getElementById('auth').style.display='flex';}},500);}
let w=0;let iv=setInterval(()=>{w+=10;document.getElementById('load').style.width=w+'%';if(w>=100){clearInterval(iv);hide();}},300);
function tabR(){document.getElementById('fR').style.display='block';document.getElementById('fL').style.display='none';}function tabL(){document.getElementById('fR').style.display='none';document.getElementById('fL').style.display='block';}
function getU(){return JSON.parse(localStorage.getItem('ek_all_users')||'[]');}function saveU(a){localStorage.setItem('ek_all_users',JSON.stringify(a));}
function reg(e){e.preventDefault();let n=document.getElementById('rN').value,em=document.getElementById('rE').value.toLowerCase(),p=document.getElementById('rP').value;let us=getU();if(us.find(u=>u.email===em)){alert('Already registered, login');tabL();return;}let id="EK"+Math.floor(100000+Math.random()*900000);let ref=new URLSearchParams(location.search).get('ref');cur={id,name:n,email:em,pass:p,coins:20,daily:20,ads:Array(10).fill(false),capC:0,history:[{t:'Welcome',a:20,time:new Date().toLocaleString()}],wd:[],refBy:ref};us.push(cur);saveU(us);localStorage.setItem('ek_current',JSON.stringify(cur));if(ref){let r=us.find(u=>u.id===ref);if(r){r.coins+=50;r.history.push({t:'Referral '+id,a:50,time:new Date().toLocaleString()});saveU(us);}}alert('20 coins added!');showD();}
function log(e){e.preventDefault();let em=document.getElementById('lE').value.toLowerCase(),p=document.getElementById('lP').value;let u=getU().find(x=>x.email===em);if(!u){alert('Not found, register');tabR();return;}if(u.pass!==p){alert('Wrong password');return;}cur=u;localStorage.setItem('ek_current',JSON.stringify(cur));showD();}
function showD(){document.getElementById('auth').style.display='none';document.getElementById('dash').style.display='block';upd();gCap();sTab('home');}
function upd(){if(!cur)return;document.getElementById('bal').innerText=cur.coins;document.getElementById('dtxt').innerText=cur.coins+' Coins';document.getElementById('dbar').style.width=Math.min(cur.daily,100)+'%';document.getElementById('capDone').innerText=cur.capC;document.getElementById('uid').innerText='ID:'+cur.id;document.getElementById('pid').innerText=cur.id;document.getElementById('pname').innerText=cur.name;document.getElementById('pemail').innerText=cur.email;document.getElementById('av').innerText=cur.name[0].toUpperCase();document.getElementById('ename').value=cur.name;let g=document.getElementById('agrid');g.innerHTML='';cur.ads.forEach((d,i)=>{let b=document.createElement('button');b.style.cssText='padding:10px;border-radius:8px;border:1px solid '+(d?'#bbf7d0':'#2563eb')+';background:'+(d?'#dcfce7':'#2563eb')+';color:'+(d?'green':'white')+';font-size:11px';b.innerText=d?'✓':'Ad '+(i+1);b.onclick=()=>watch(i);g.appendChild(b);});document.getElementById('refL').value=location.origin+location.pathname+'?ref='+cur.id;localStorage.setItem('ek_current',JSON.stringify(cur));let us=getU();let idx=us.findIndex(u=>u.id===cur.id);if(idx>=0){us[idx]=cur;saveU(us);}renderH();}
function renderH(){let eh=document.getElementById('ehist');let wh=document.getElementById('whist');eh.innerHTML=cur.history.slice().reverse().map(h=>'<div style="display:flex;justify-content:space-between;background:#f9fafb;padding:6px 8px;border-radius:8px;margin-bottom:4px;font-size:12px"><span>'+h.t+'</span><b style="color:'+(h.a<0?'red':'green')+'">'+h.a+'</b></div>').join('');wh.innerHTML=cur.wd.length?cur.wd.slice().reverse().map(h=>'<div style="background:#fefce8;padding:6px 8px;border-radius:8px;margin-bottom:4px;font-size:12px">'+h.amt+' Coins - '+h.upi+' - '+h.time+'</div>').join(''):'<p style="font-size:12px;color:#999;text-align:center">No withdrawal</p>';}
function sTab(t){document.getElementById('home').style.display='none';document.getElementById('hist').style.display='none';document.getElementById('wal').style.display='none';document.getElementById('prof').style.display='none';document.getElementById('bh').style.background='transparent';document.getElementById('bhi').style.background='transparent';document.getElementById('bw').style.background='transparent';document.getElementById('bp').style.background='transparent';if(t==='home'){document.getElementById('home').style.display='block';document.getElementById('bh').style.background='#eff6ff';}if(t==='hist'){document.getElementById('hist').style.display='block';document.getElementById('bhi').style.background='#eff6ff';renderH();}if(t==='wal'){document.getElementById('wal').style.display='block';document.getElementById('bw').style.background='#eff6ff';}if(t==='prof'){document.getElementById('prof').style.display='block';document.getElementById('bp').style.background='#eff6ff';}}
function watch(i){if(cur.ads[i])return;window.open(DIRECT,'_blank');let m=document.getElementById('adM');m.style.display='flex';let s=10;let iv2=setInterval(()=>{document.getElementById('adT').innerText=s;document.getElementById('adB').style.width=((10-s)*10)+'%';if(s<=0){clearInterval(iv2);m.style.display='none';cur.ads[i]=true;cur.coins+=5;cur.daily+=5;cur.history.push({t:'Ad '+(i+1),a:5,time:new Date().toLocaleString()});upd();alert('5 Coins Added!');}s--;},1000);}
function gCap(){let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";code="";for(let i=0;i<6;i++)code+=c[Math.floor(Math.random()*c.length)];document.getElementById('capB').innerText=code;}
function vCap(){let ip=document.getElementById('capI').value.toUpperCase().trim();if(ip===code){cur.coins+=2;cur.daily+=2;cur.capC++;cur.history.push({t:'Captcha',a:2,time:new Date().toLocaleString()});document.getElementById('capI').value='';gCap();upd();alert('+2 Coins Added!');}else{alert('Wrong code!');gCap();}}
function copyR(){navigator.clipboard.writeText(document.getElementById('refL').value);alert('Copied!');}
function saveP(){let nn=document.getElementById('ename').value.trim();if(!nn){alert('Enter name');return;}cur.name=nn;upd();alert('Saved!');}
function wd(){let upi=document.getElementById('upi').value.trim();let amt=parseInt(document.getElementById('wamt').value);if(!upi){alert('Enter UPI');return;}if(amt<500){alert('Min 500');return;}if(amt>cur.coins){alert('Low balance: '+cur.coins);return;}cur.coins-=amt;cur.wd.push({upi,amt,time:new Date().toLocaleString()});cur.history.push({t:'Withdraw '+upi,a:-amt,time:new Date().toLocaleString()});upd();alert('Request sent! '+amt+' Coins');sTab('hist');}
function logout(){localStorage.removeItem('ek_current');location.reload();}
</script></body></html>
